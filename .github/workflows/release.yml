# Builds the Windows installer and the macOS disk image.
# - Manual run (Actions → Build installers → Run workflow): files are attached to the run as artifacts.
# - Pushing a tag such as v1.0.0: files are also published on the Releases page.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Test
        run: dotnet test tests/Alpixa.Tests
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          ./build/build-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: AlpixaSetup-windows
          path: artifacts/AlpixaSetup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst
      - name: Build disk image
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build/build-macos.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Alpixa-macos
          path: artifacts/Alpixa.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AlpixaSetup.exe dist/Alpixa.dmg \
            --repo "$GITHUB_REPOSITORY" --title "Alpixa $GITHUB_REF_NAME" \
            --notes "Windows: AlpixaSetup.exe dosyasını indirip çalıştırın. macOS: Alpixa.dmg dosyasını indirip Alpixa'yı Uygulamalar klasörüne sürükleyin. Ayrıntılı kurulum: README → 4. Kurulum."
